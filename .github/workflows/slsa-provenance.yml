name: SLSA Provenance

# Runs when a release is published and gives that release something to attest.
#
# Previously this workflow downloaded the release's assets, found none — our
# releases carry no assets — and therefore never reached the SLSA generator at
# all. What it did upload was a hand-written in-toto statement with no
# signature, which is not provenance: anyone can write that JSON.
#
# Now the workflow produces the artefact first: a reproducible source archive
# built with `git archive` from the release tag, plus its SHA-256 checksum.
# Those become release assets, and the SLSA generic generator issues signed
# Level 3 provenance over them. The published container images carry their own
# provenance and signature from docker-publish.yml; this covers the source
# release.

on:
  release:
    types: [published]

permissions: {}

jobs:
  package:
    name: Build source archive
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the archive and checksum as release assets
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # `git archive` is deterministic for a given tree: same tag, same bytes.
      # --format=tar plus a fixed gzip level keeps the digest stable across
      # reruns, which is what makes re-verification meaningful.
      - name: Build the source archive
        id: archive
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          name="timetracker-${TAG}-source.tar.gz"
          git archive --format=tar --prefix="timetracker-${TAG}/" "$TAG" \
            | gzip -9 -n > "$name"
          sha256sum "$name" > "${name}.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cat "${name}.sha256"

      - name: Compute provenance subjects
        id: subjects
        env:
          NAME: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "$NAME" | cut -d' ' -f1)"
          subjects="$(jq -nc --arg n "$NAME" --arg d "$digest" \
            '[{name:$n, digest:{sha256:$d}}]' | base64 -w0)"
          echo "subjects=$subjects" >> "$GITHUB_OUTPUT"

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$NAME" "${NAME}.sha256" --clobber

  provenance:
    name: SLSA Level 3 provenance
    needs: package
    permissions:
      actions: read # read the workflow run that built the archive
      id-token: write # keyless signing identity
      contents: write # upload the provenance as a release asset
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.package.outputs.subjects }}
      upload-assets: true
