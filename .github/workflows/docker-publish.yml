name: Docker Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '44 12 * * *'
  push:
    branches:
      - "main"
      - "v*"
    tags:
      - "v*.*.*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default; each caller job grants exactly the set the
# reusable's jobs request.
permissions: {}

jobs:
  # Production + E2E images. The `app` target's tag scheme (semver / branch /
  # sha / production / latest) is generated by docker/metadata-action inside
  # the reusable via metadata-images/-tags; `app-e2e` carries its own tags
  # from docker-bake.hcl. GIT_SHA/GIT_REF/BUILD_DATE are exported to the HCL
  # variable blocks in pre-build-command. Trivy scans the produced images on
  # push (skipped on PR validation builds, where push is off).
  build:
    uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      targets: app,app-e2e
      push: ${{ github.event_name != 'pull_request' }}
      # Build from the local checkout: the metadata-action tag/label files are
      # local $RUNNER_TEMP paths the default git-remote context cannot see.
      bake-source: .
      metadata-images: ghcr.io/${{ github.repository }}
      metadata-tags: |
        type=schedule
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=sha
        type=raw,value=production,enable={{is_default_branch}}
        type=raw,value=latest,enable={{is_default_branch}}
      pre-build-command: |
        {
          echo "GIT_SHA=$GITHUB_SHA"
          echo "GIT_REF=$GITHUB_REF_NAME"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$GITHUB_ENV"
      # Supply chain. All four are gated on push=true inside the reusable, so
      # pull_request validation builds skip them instead of failing.
      #   sign        Cosign keyless signature per pushed tag
      #   attest      buildx SLSA provenance, mode=max, in-image
      #   sbom        buildx in-image SBOM attestation
      #   sbom-attest merged CycloneDX SBOM (composer.lock + Syft scan of the
      #               pushed digest), attached to the digest as a Cosign
      #               attestation and uploaded as a workflow artifact
      sign: true
      attest: true
      sbom: true
      sbom-attest: true

  # GitHub-issued SBOM attestation on top of the Cosign one the build already
  # attaches. Separate job because it needs `attestations: write`, which the
  # build workflow deliberately does not request.
  attest-sbom:
    needs: build
    if: github.event_name != 'pull_request'
    uses: netresearch/.github/.github/workflows/attest-sbom.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      subjects: ${{ needs.build.outputs.sbom-subjects }}

  # Prod-like image with the Symfony profiler (admin-gated); operators switch
  # to it on demand — never the default deployment. Built ONLY on a tag push
  # (release) or manual dispatch so the deployed :profiling-<sha> tag is
  # stamped with the release ref deterministically (building it on main-push
  # too made both runs write the same tag, last-writer-wins). Its tags come
  # from docker-bake.hcl, so no metadata-action here.
  build-profiling:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      targets: app-profiling
      push: true
      bake-source: .
      sign: true
      attest: true
      sbom: true
      sbom-attest: true
      pre-build-command: |
        {
          echo "GIT_SHA=$GITHUB_SHA"
          echo "GIT_REF=$GITHUB_REF_NAME"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$GITHUB_ENV"

  # Same pairing for the profiling image: it is deployed to production on
  # demand, so it gets the same attestation as the default one.
  attest-sbom-profiling:
    needs: build-profiling
    uses: netresearch/.github/.github/workflows/attest-sbom.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      subjects: ${{ needs.build-profiling.outputs.sbom-subjects }}
