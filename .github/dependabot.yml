version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns:
          - "*"
    ignore:
      # typescript-eslint declares `typescript: ">=4.8.4 <6.1.0"` and hard-fails
      # at load ("typescript-eslint does not support TS 7.0"), so anything from
      # 6.1 up breaks `eslint .`. 8.65.0 is latest and no release supports it.
      # Drop this entry once typescript-eslint widens the peer range; the pin in
      # frontend/package.json goes with it.
      - dependency-name: typescript
        versions:
          - ">= 6.1"
  # Root npm lockfile (Playwright e2e tooling). Was unmonitored, so dev-tooling
  # advisories (http-proxy-middleware, uuid) never produced a bump PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
  # Composer (PHP backend). Was unmonitored — this is why the phpoffice/
  # phpspreadsheet CVE-2026-59931/2/3 advisory produced no bump PR and only
  # surfaced as a red composer-audit gate. Now covered.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns:
          - "*"
  # Container images in compose.yml (nginx, mariadb, openldap). Were unmonitored,
  # so base-image CVEs there never produced a bump PR. docker-bake.hcl is NOT
  # covered by either ecosystem - see the note at the top of that file.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns:
          - "*"
    # Dependency pull requests auto-merge in this repository, so an
    # unconstrained entry ships major and minor jumps unattended: four minutes
    # after #723 landed, #724 auto-merged MariaDB 12.3 -> 13.0 and nginx
    # 1.28 -> 1.31, and left every serverVersion declaration in .env,
    # doctrine.yaml, the Makefile and the docs pointing at a version the image
    # no longer was. A major database version is a decision, not a bump.
    #
    # Patch-level version updates still flow. Whether a pure DIGEST refresh (the
    # tag unchanged, the image rebuilt) is also filtered by these update-types
    # is NOT documented by GitHub and has not been tested here - and that is the
    # case this entry exists for, since it is how a base-image CVE fix arrives.
    # Check the next weekly run: if digest refreshes stop appearing, narrow the
    # ignore to `dependency-name: mariadb` instead of `*`.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
