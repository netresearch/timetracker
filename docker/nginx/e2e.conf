server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Security headers for everything this server answers, including files it
    # serves straight off disk — those never reach PHP, so
    # SecurityHeadersSubscriber cannot set them. `always` so they are present
    # on error responses too.
    #
    # No Content-Security-Policy here on purpose: the policy is nonce-based and
    # the nonce is generated per request in PHP. A static policy from nginx
    # would be intersected with PHP's by the browser and refuse every nonced
    # inline script. Static assets execute no inline script and need none.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        # Try to serve file directly, fallback to Symfony front controller
        try_files $uri /index.php$is_args$args;
    }

    location /bundles {
        alias /var/www/html/public/bundles;
        access_log off;
        expires 30d;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app-e2e:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # PHP sets the same three headers (SecurityHeadersSubscriber). Drop the
        # upstream copies so the browser receives exactly one of each: nginx's
        # add_header APPENDS to an upstream header rather than replacing it.
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;


        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/symfony_error.log;
    access_log /var/log/nginx/symfony_access.log;

    location ~ /\.(ht|git|svn|env|docker) {
        deny all;
    }
}
