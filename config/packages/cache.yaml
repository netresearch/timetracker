framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: timetracker

        # The app cache lives in the database (table cache_items, created by
        # migrations/Version20261119_AppCacheTable.php), see ADR-028. Its live
        # consumer is the login-throttling limiter of the main firewall, whose
        # counters therefore survive FPM reloads and deploys.
        app: cache.adapter.doctrine_dbal
        default_doctrine_dbal_provider: doctrine.dbal.default_connection
