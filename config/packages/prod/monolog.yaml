monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
        nested:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
        # Refused LDAP logins are warnings, and main drops those unless the
        # request also logs an error. This handler keeps them on record;
        # an LDAP error is written twice, here and in the flushed buffer.
        ldap:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: warning
            channels: ["ldap"]
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
