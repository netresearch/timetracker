monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
        nested:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
        # Refused logins are warnings, and main drops those unless the request
        # also logs an error. They are the only application record of failed
        # logins (ADR-011), so this channel is written directly.
        ldap:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: warning
            channels: ["ldap"]
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
