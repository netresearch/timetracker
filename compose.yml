---
services:
  # Main application service (build with: docker bake app)
  app:
    image: ghcr.io/netresearch/timetracker:production
    # APP_ENV=prod / APP_DEBUG=0 come from the image; the image ships an empty
    # .env, so ALL runtime configuration must be passed as real env vars here.
    # Variables with a default in config/services.yaml (REQUIRE_TWO_FACTOR,
    # WEBAUTHN_*, MCP_ALLOWED_HOSTS) stay out: an entry would override env_file.
    environment:
      - TRUSTED_PROXY_ALL
      - TRUSTED_PROXY_LIST
      # no in-file default (it would hardcode credentials); the repository
      # .env supplies a value matching the bundled db service for local runs
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL (see docs/DEPLOYMENT_GUIDE.md)}
      - APP_SECRET=${APP_SECRET:?Set APP_SECRET (e.g. openssl rand -base64 32) — the repo .env ships an insecure dev placeholder}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-1}
      # bare passthrough: only set when exported — an empty string would defeat
      # the env(default:secret:...) fallback to APP_SECRET in services.yaml
      - APP_ENCRYPTION_KEY
      - APP_LOCALE=${APP_LOCALE:-en}
      - APP_TITLE=${APP_TITLE:-Netresearch TimeTracker}
      - APP_LOGO_URL=${APP_LOGO_URL:-/images/logo-netresearch.svg}
      - APP_HEADER_URL=${APP_HEADER_URL:-}
      - APP_SHOW_BILLABLE_FIELD_IN_EXPORT=${APP_SHOW_BILLABLE_FIELD_IN_EXPORT:-false}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LDAP_HOST=${LDAP_HOST:-}
      - LDAP_PORT=${LDAP_PORT:-389}
      - LDAP_READUSER=${LDAP_READUSER:-}
      - LDAP_READPASS=${LDAP_READPASS:-}
      - LDAP_BASEDN=${LDAP_BASEDN:-}
      - LDAP_USERNAMEFIELD=${LDAP_USERNAMEFIELD:-uid}
      - LDAP_USESSL=${LDAP_USESSL:-false}
      - LDAP_CREATE_USER=${LDAP_CREATE_USER:-true}
    volumes:
      # Production volumes (named volumes for data persistence)
      - app-pub:/var/www/html/public
      - app-cache:/var/www/html/var/cache  
      - app-logs:/var/www/html/var/log
    depends_on:
      - db
    restart: always
    networks:
      default:
        # docker/nginx/default.conf forwards FastCGI to phpfpm:9000
        aliases: [phpfpm]
    profiles:
      - prod
      - production

  # Development app service (build with: docker bake app-dev)
  # LDAP and other config read from .env files (Symfony dotenv)
  app-dev:
    image: ghcr.io/netresearch/timetracker:dev
    environment:
      - APP_ENV=dev
      - APP_DEBUG=1
      - TRUSTED_PROXY_ALL
      - TRUSTED_PROXY_LIST
    volumes:
      # Development volumes (bind mounts for live editing)
      - .:/var/www/html
      - ./public:/var/www/html/public
      - ./var/cache:/var/www/html/var/cache
      - ./var/log:/var/www/html/var/log
      - /usr/local/share/ca-certificates/:/usr/local/share/ca-certificates/host
      # PHP test config with increased memory limit (2G)
      - ./docker/php/test.ini:/usr/local/etc/php/conf.d/99-test.ini:ro
    depends_on:
      - db
    restart: "no"
    profiles:
      - dev
      - development

  # Development tools service (build with: docker bake app-tools)
  # Static analysis, linting - no DB dependencies
  app-tools:
    image: ghcr.io/netresearch/timetracker:tools
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
    volumes:
      # Tools volumes (bind mounts for source code access only)
      - .:/var/www/html
      - ./var/cache:/var/www/html/var/cache
      - ./var/log:/var/www/html/var/log
      # PHP test config with increased memory limit (2G)
      - ./docker/php/test.ini:/usr/local/etc/php/conf.d/99-test.ini:ro
    restart: "no"
    profiles: 
      - tools
      - dev-tools

  # Production web server
  httpd:
    image: nginx:1.31.10-alpine@sha256:7fc0fb4af7bf006aeb31aea88069976060f8f0a0a86b667126742cc17f4e31ae
    volumes:
      - app-pub:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: always
    ports:
      - ${HTTP_PORT:-8765}:80
    profiles: 
      - prod
      - production

  # Development web server
  httpd-dev:
    image: nginx:1.31.10-alpine@sha256:7fc0fb4af7bf006aeb31aea88069976060f8f0a0a86b667126742cc17f4e31ae
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-dev
    restart: "no"
    ports:
      - ${HTTP_PORT:-8765}:80
    profiles:
      - dev
      - development

  # Production database
  db:
    image: mariadb:12.3@sha256:4aaf88b3106382c8c18e49f0cec60267be618fc22f858c4503afb2a2555afed3
    environment:
      # Run mariadb-upgrade when the datadir predates the image (CodeRabbit on
      # #723). A 12.1 datadir does start and serve under 12.3, but the
      # entrypoint then logs "MariaDB upgrade ... required, but skipped" and
      # leaves the system tables and the healthcheck users un-migrated.
      - MARIADB_AUTO_UPGRADE=1
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-global123}
      - MYSQL_USER=${DB_USER:-timetracker}
      - MYSQL_PASSWORD=${DB_PASSWORD:-timetracker}
      - MYSQL_DATABASE=${DB_NAME:-timetracker}
    volumes:
      - db-data:/var/lib/mysql
      - ./sql/full.sql:/docker-entrypoint-initdb.d/001_full.sql
      # Test data for dev/E2E testing (fixed date 2024-01-15 for deterministic tests)
      - ./sql/testdata.sql:/docker-entrypoint-initdb.d/002_testdata.sql
    restart: always
    profiles:
      - prod
      - production
      - dev
      - development
      - test

  # Unit test database (for PHPUnit tests)
  db_unittest:
    image: mariadb:12.3@sha256:4aaf88b3106382c8c18e49f0cec60267be618fc22f858c4503afb2a2555afed3
    environment:
      - MARIADB_AUTO_UPGRADE=1
      - MYSQL_ROOT_PASSWORD=${UNITTEST_DB_ROOT_PASSWORD:-global123}
      - MYSQL_USER=${UNITTEST_DB_USER:-unittest}
      - MYSQL_PASSWORD=${UNITTEST_DB_PASSWORD:-unittest}
      - MYSQL_DATABASE=${UNITTEST_DB_NAME:-unittest}
    volumes:
      - db-unittest-data:/var/lib/mysql
      - ./sql/unittest/001_testtables.sql:/docker-entrypoint-initdb.d/001_testtables.sql
      - ./sql/unittest/002_testdata.sql:/docker-entrypoint-initdb.d/002_testdata.sql
    restart: always
    profiles: 
      - dev
      - development
      - test

  # E2E test database (separate from dev to avoid data conflicts)
  db-e2e:
    image: mariadb:12.3@sha256:4aaf88b3106382c8c18e49f0cec60267be618fc22f858c4503afb2a2555afed3
    environment:
      - MARIADB_AUTO_UPGRADE=1
      - MYSQL_ROOT_PASSWORD=${E2E_DB_ROOT_PASSWORD:-global123}
      - MYSQL_USER=${E2E_DB_USER:-timetracker}
      - MYSQL_PASSWORD=${E2E_DB_PASSWORD:-timetracker}
      - MYSQL_DATABASE=${E2E_DB_NAME:-timetracker}
    volumes:
      - db-e2e-data:/var/lib/mysql
      - ./sql/full.sql:/docker-entrypoint-initdb.d/001_full.sql
      - ./sql/testdata.sql:/docker-entrypoint-initdb.d/002_testdata.sql
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    profiles:
      - e2e

  # E2E test app service (build with: docker bake app-e2e)
  # Uses separate db-e2e to avoid conflicts with dev database
  app-e2e:
    image: ghcr.io/netresearch/timetracker:e2e
    environment:
      - APP_ENV=test
      - APP_DEBUG=1
      - TRUSTED_PROXY_ALL
      - TRUSTED_PROXY_LIST
      # Frozen time for deterministic E2E tests - matches test data in sql/testdata.sql
      - APP_FROZEN_TIME=2024-01-15 12:00:00
      # Use separate E2E database to avoid conflicts with dev
      - DATABASE_URL=mysql://timetracker:${E2E_DB_PASSWORD:-timetracker}@db-e2e:3306/timetracker?serverVersion=mariadb-12.3.3&charset=utf8mb4
      # Coverage collection (set COVERAGE_ENABLED=1 XDEBUG_MODE=coverage to enable)
      - COVERAGE_ENABLED=${COVERAGE_ENABLED:-0}
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
    volumes:
      - .:/var/www/html
      - ./public:/var/www/html/public
      - ./var/cache:/var/www/html/var/cache
      - ./var/log:/var/www/html/var/log
    depends_on:
      db-e2e:
        condition: service_started
      ldap-dev:
        condition: service_healthy
    restart: "no"
    profiles:
      - e2e

  # E2E test web server (port 8766 to avoid conflict with dev)
  httpd-e2e:
    image: nginx:1.31.10-alpine@sha256:7fc0fb4af7bf006aeb31aea88069976060f8f0a0a86b667126742cc17f4e31ae
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/e2e.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-e2e
    restart: "no"
    ports:
      - ${E2E_HTTP_PORT:-8766}:80
    profiles:
      - e2e

  # Development LDAP server
  # osixia/openldap v2 is a rewrite of v1: other variables, paths and an
  # internal listener on 3890. The service keeps the v1 contract the app,
  # docs and tests rely on: port 389, suffix dc=dev,dc=local, root DN
  # cn=admin,dc=dev,dc=local and read-only DN cn=readuser,dc=dev,dc=local.
  ldap-dev:
    image: osixia/openldap:2.6.15@sha256:b804ae8b3f3e50be7315916e929ad7b21897a2f7eb3a482096967f509c61d264
    environment:
      - OPENLDAP_BOOTSTRAP_ORGANIZATION=Development Company
      - OPENLDAP_BOOTSTRAP_SUFFIX=dc=dev,dc=local
      # The *_PASSWORD_HASHED variables take any userPassword value. A value
      # without a {SCHEME} prefix is stored and compared as cleartext, which
      # keeps the plain dev passwords and their overrides working.
      - OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED=${LDAP_ADMIN_PASSWORD:-admin123}
      - OPENLDAP_BOOTSTRAP_DATA_READONLY=true
      - OPENLDAP_BOOTSTRAP_DATA_READONLY_DN=cn=${LDAP_READONLY_USER_USERNAME:-readuser},dc=dev,dc=local
      - OPENLDAP_BOOTSTRAP_DATA_READONLY_PASSWORD_HASHED=${LDAP_READONLY_USER_PASSWORD:-readuser}
      # Listen on 389 like v1 (the image default is ldap://:3890).
      - OPENLDAP_URLS=ldap://:389 ldapi:///
    volumes:
      # v2 skips its bootstrap when either directory holds data and does not
      # migrate v1 data, so it gets new volumes instead of the v1 ones.
      - ldap-dev-v2-data:/var/lib/openldap/openldap-data
      - ldap-dev-v2-config:/etc/openldap/slapd.d
      # Imported on the first bootstrap; the image reads the directory as is.
      - ./docker/ldap/users-only.ldif:/container/services/openldap-bootstrap/assets/ldif/data/custom/users.ldif:ro
    ports:
      - "3389:389"
    restart: "no"
    healthcheck:
      # slapd accepts connections on 389 several seconds before the bootstrap
      # LDIF is imported, so a port probe reports healthy while every seeded
      # user is still missing. Assert one of those users instead. The image's
      # ACL denies anonymous search (it answers "No such object"), hence the
      # read-only account. See #765.
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -D \"$$OPENLDAP_BOOTSTRAP_DATA_READONLY_DN\" -w \"$$OPENLDAP_BOOTSTRAP_DATA_READONLY_PASSWORD_HASHED\" -b \"$$OPENLDAP_BOOTSTRAP_SUFFIX\" '(uid=unittest)' dn | grep -q '^dn: uid=unittest,'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    profiles:
      - dev
      - development
      - test
      - e2e

networks:
  default:
    driver: "bridge"

volumes:
  # Production volumes
  app-pub:
    driver: local
  app-cache:
    driver: local
  app-logs:
    driver: local
  db-data:
    driver: local

  # Unit test volume
  db-unittest-data:
    driver: local

  # E2E test volume (separate from dev)
  db-e2e-data:
    driver: local

  # Development LDAP volumes (osixia/openldap v2 layout)
  ldap-dev-v2-data:
    driver: local
  ldap-dev-v2-config:
    driver: local